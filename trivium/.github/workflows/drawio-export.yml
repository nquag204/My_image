name: Convert XML to Images
on:
  push:
    paths:
      - '**.xml'
      - '**.drawio'
  workflow_dispatch:

jobs:
  drawio-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Export drawio to SVG
        uses: rlespinasse/drawio-export-action@v2
        with:
          format: svg
          transparent: true

      - name: Commit exported images
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add export/
          git commit -m "Auto-generate images from XML"
          git push
